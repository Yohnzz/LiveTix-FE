name: livetix
description: LiveTix - aplikasi pengelolaan konser dan penjualan tiket.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  file_picker: ^8.1.7
  flutter_dotenv: ^6.0.1
  flutter_map: ^8.3.2
  geolocator: ^13.0.0
  google_fonts: ^6.2.1
  http: ^1.2.0
  image_picker: ^1.2.4
  latlong2: ^0.10.1
  mobile_scanner: ^7.5.0
  qr_flutter: ^4.1.0
  flutter_markdown: ^0.7.4
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.2
  google_maps_flutter: ^2.18.1
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flutter_local_notifications: 19.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
